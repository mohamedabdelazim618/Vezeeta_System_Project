<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
</head>

<body>
    <div class="container">
        <link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
        <h2>Register</h2>
        {% if message %}
        <div class="message {% if 'successful' in message %}success{% else %}error{% endif %}">
            {{ message }}
        </div>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input id="password" type="password" name="password" placeholder="Password" required>
            <input id="confirm_password" type="password" name="confirm_password" placeholder="Confirm Password"
                required>
            <input type="number" name="age" placeholder="Age (optional)" min="0">
            <label style="display:block; margin:8px 0; font-size:0.9em;"><input id="show_pwd" type="checkbox"> Show
                password</label>
            <button type="submit" class="btn btn-accent">Register</button>
        </form>
        <div class="login-link">
            Already have an account? <a href="{{ url_for('login') }}">Login here</a>
        </div>
    </div>
    <script>
        document.getElementById('show_pwd').addEventListener('change', function (e) {
            var p = document.getElementById('password');
            var c = document.getElementById('confirm_password');
            if (this.checked) {
                p.type = 'text';
                c.type = 'text';
            } else {
                p.type = 'password';
                c.type = 'password';
            }
        });
    </script>
    <script src="{{ url_for('static', filename='ui.js') }}"></script>
</body>

</html>
