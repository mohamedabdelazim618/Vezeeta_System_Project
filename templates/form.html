<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='form.css') }}">
</head>

<body>
    <div class="form-container">
        <h1>Student Grade Form</h1>

        {% if message %}
        <div class="message {% if 'successfully' in message.lower() %}success{% else %}error{% endif %}">
            {{ message }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('signup_results') }}">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="Enter student name">
            </div>

            <div class="form-group">
                <label for="grade">Grade:</label>
                <select id="grade" name="grade" required>
                    <option value="">Select Grade</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                </select>
            </div>

            <div class="form-group">
                <label for="level">Level:</label>
                <select id="level" name="level" required>
                    <option value="">Select Level</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mark">Mark:</label>
                <input type="number" id="mark" name="mark" required placeholder="Enter mark (0-100)" min="0" max="100">
            </div>

            <div class="form-group">
                <input type="submit" value="Submit">
            </div>
        </form>

        <div class="back-link">
            <a href="{{ url_for('dashboard', username='User') }}">← Back to Dashboard</a>
        </div>
    </div>
</body>

</html>
